# cargo-deny configuration.
# License gate: the project's final license is undecided (owner leans MIT), so every
# dependency must be MIT-compatible. MPL-2.0 is allowed (file-level copyleft composes
# with a permissive outer license); GPL/AGPL/LGPL are not.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # Mozilla's CA certificate set (webpki-roots) is data, not code, and
    # this licence asks only that the disclaimer travel with it.
    "CDLA-Permissive-2.0",
    # One clause of aws-lc-sys's compound expression offers it.
    "MIT-0",
]

[advisories]
# A yanked version in the lockfile is always ours to fix.
yanked = "deny"
# "Unmaintained" only counts against crates this workspace chose. The
# GTK3 bindings, proc-macro-error and the unic crates all arrive under
# Tauri and cannot be swapped out from here; flagging them every run
# would train everyone to ignore the gate that catches the real thing.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
