# cargo-deny configuration.
# License gate: the project's final license is undecided (owner leans MIT), so every
# dependency must be MIT-compatible. MPL-2.0 is allowed (file-level copyleft composes
# with a permissive outer license); GPL/AGPL/LGPL are not.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
