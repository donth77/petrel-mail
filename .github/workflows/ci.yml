name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    # The UI had no test runner at all, so pure logic — snooze times, the
    # notification rules, recipient parsing — was verified by looking at the
    # running app. That found two date bugs and would not have found a third.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop/ui exec tsc --noEmit
      # rules-of-hooks specifically: a hook after an early return blanks the
      # whole app at runtime and is invisible to tsc and to the tests.
      - run: pnpm --dir apps/desktop/ui lint
      - run: pnpm --dir apps/desktop/ui test
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude petrel-desktop --all-targets -- -D warnings
      - run: cargo test
      # IMAP slice against a throwaway server (synthetic mail only).
      - name: IMAP integration slice
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --rm --name petrel-greenmail -p 3143:3143 -p 3025:3025 \
            -e GREENMAIL_OPTS='-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=petrel:petrelpass@example.com' \
            greenmail/standalone:latest
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/3143) >/dev/null 2>&1 && break
            sleep 2
          done
          # `local::` only — live_provider_probe needs a real account and is
          # opt-in via PETREL_IMAP_* (it skips rather than fails without them).
          cargo test -p petrel-providers --features insecure-plaintext --test imap_slice local:: -- --ignored --nocapture
          # Ambiguous-send reconciliation (audit blocker ARC-03) — serial: it
          # asserts exact copy counts in a shared mailbox.
          cargo test -p petrel-providers --features insecure-plaintext --test ambiguous_send -- --ignored --nocapture --test-threads=1
          # Server → parse → store → search, and resync without duplication.
          cargo test -p petrel-providers --features insecure-plaintext --test sync_vertical -- --ignored --nocapture
          # UIDVALIDITY reset recovery — scripted in-process server, no container.
          cargo test -p petrel-providers --features insecure-plaintext --test uidvalidity_reset -- --nocapture
          docker stop petrel-greenmail
      # Fast benchmark sanity at reduced scale; the full 100k run is manual.
      - run: PETREL_BENCH_N=10000 cargo test --release -p petrel-engine --test store_spike -- --ignored --nocapture
        if: matrix.os == 'ubuntu-latest'
  shell:
    # The desktop crate is not a default workspace member (its dependency tree
    # is heavy), so `cargo test` above never compiles it — a change that broke
    # the shell used to sail through green. This job builds it the way
    # scripts/rebuild.sh does: UI assets first, then the crate with the
    # production feature, under clippy's -D warnings.
    #
    # All three platforms, because the engine being portable says nothing
    # about the shell: WebKitGTK on Linux and WebView2 on Windows are where
    # a Tauri app actually differs. This job was macOS-only, so whether the
    # shell even compiled elsewhere was simply unknown.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Tauri on Linux builds against WebKitGTK and friends; none of it is on
      # the runner by default.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev build-essential curl wget file libxdo-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop/ui build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p petrel-desktop --all-targets --features custom-protocol -- -D warnings
      - run: cargo test -p petrel-desktop --features custom-protocol
