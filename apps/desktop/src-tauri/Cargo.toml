[package]
name = "petrel-desktop"
description = "Petrel's Tauri desktop shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "petrel_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri decides dev-vs-production on this feature, NOT on cargo's release flag:
# without it the webview navigates to `build.devUrl` (the Vite dev server) and
# shows a blank window when no dev server is running. The Tauri CLI passes it
# for production builds; `cargo petrel` (see .cargo/config.toml) does the same.
custom-protocol = ["tauri/custom-protocol"]
# Lets the app talk to the loopback test server so the real-mail path can be
# exercised without a live account. Never enabled in a shipping build.
dev-plaintext-imap = ["petrel-providers/insecure-plaintext"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Just the timer, for the sync poll. Tauri already runs on tokio; this only
# makes the dependency explicit rather than borrowed from its internals.
tokio = { version = "1", features = ["time"] }
tauri = { version = "2.11", features = [] }
# Desktop notifications. macOS routes these through Notification Center, which
# means the OS decides whether they appear — the in-app toast is the fallback
# that always works.
tauri-plugin-notification = "2"
# A save panel for the mbox export. The OS owns the file picker; asking it is
# the only way the export lands where the user actually wants it.
tauri-plugin-dialog = "2"
# Handing a file to whatever opens it, without going through a shell. Used
# from Rust only, so it needs no capability entry.
tauri-plugin-opener = "2"
# Signed updates. The check is deliberately manual — see commands/updates.rs.
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
dirs = "6"
# Only to name the TLS crypto provider at startup; see `run()`.
rustls = "0.23"
# Account passwords live in the OS keychain, never in a file. The spec is
# explicit about it and the onboarding copy promises it.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Turning an address into server settings.
petrel-autoconfig = { path = "../../../crates/petrel-autoconfig" }
# The RFC 8058 one-click unsubscribe POST. Same build as autoconfig's.
ureq = { version = "3", default-features = false, features = ["rustls"] }
petrel-engine = { path = "../../../crates/petrel-engine" }
petrel-providers = { path = "../../../crates/petrel-providers" }
petrel-mime = { path = "../../../crates/petrel-mime" }
# Demo-mode seeding only; used when no account is configured.
petrel-testkit = { path = "../../../crates/petrel-testkit" }

# macOS notifications, natively.
#
# The notification plugin's macOS path goes through notify-rust and
# mac-notification-sys, which still speak NSUserNotification — deprecated in
# macOS 11 and no longer delivering anything on macOS 26. It reports success
# either way, so nothing above it can tell. UserNotifications.framework is the
# API Apple replaced it with, and the only one that still works.
#
# objc2, objc2-foundation and block2 are already in the tree via Tauri; this
# adds the one framework binding they do not cover.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSettings",
    "UNError",
    "block2",
] }
block2 = "0.6"

[dev-dependencies]
http = "1"
tempfile.workspace = true
petrel-engine = { path = "../../../crates/petrel-engine" }
