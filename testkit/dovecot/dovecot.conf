# Minimal Dovecot 2.4 for Petrel's IMAP integration tests.
# Plaintext on purpose: loopback-only, throwaway container, synthetic mail only.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *

mail_driver = maildir
mail_path = /srv/mail/%{user}/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb static {
  password = petrelpass
}

userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/mail/%{user}
  }
}

log_path = /dev/stderr

service imap-login {
  inet_listener imap {
    port = 143
  }
}
