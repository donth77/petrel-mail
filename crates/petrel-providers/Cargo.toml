[package]
name = "petrel-providers"
description = "Provider backends: IMAP/SMTP, Gmail API, Microsoft Graph (JMAP later)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Plaintext IMAP exists ONLY for loopback integration tests against a throwaway
# container. It is never compiled into shipping binaries — the security posture
# is TLS-always (see docs: no plaintext code paths reachable in production).
insecure-plaintext = []

[dependencies]
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "time"] }
tokio-rustls = "0.26"
# TCP keepalive on the socket before rustls sees it. Tokio's own TcpStream
# cannot set it and already depends on this crate, so it costs no new build.
socket2 = "0.6"
rustls = "0.23"
webpki-roots = "1"
futures = "0.3"
# Builds RFC 5322 messages. Hand-rolling headers is fine until the first
# non-ASCII subject or attachment, at which point it is encoded-word and
# multipart boundaries — solved problems not worth re-solving.
mail-builder = "0.4"
base64 = "0.22"
# The OAuth flow's arithmetic: a SHA-256 for the PKCE challenge, the system
# random source for the verifier, and JSON to read a token response. Already
# in the tree by way of other crates, so this costs no new build.
sha2 = "0.10"
getrandom = "0.3"
serde_json.workspace = true
thiserror.workspace = true
# Probe samples DATE/FROM/SUBJECT as header literals and parses them here.
# ENVELOPE is 7-bit quoted-strings; Japanese mail is not.
petrel-mime = { path = "../petrel-mime" }

tempfile.workspace = true

[dev-dependencies.petrel-engine]
path = "../petrel-engine"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# The RFC 7636 worked example is checked by hashing it here too.
sha2 = "0.10"

